[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minerva-dna"
version = "0.1.0"
description = "Minerva: genomic language models for coevolutionary mining"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "torch>=2.1.0,<3",
  "transformers>=4.41.0,<6",
  "numpy>=1.23,<3",
  "biopython>=1.80,<2",
  "pyrodigal>=3.0,<4",
  "huggingface_hub>=0.23.0,<2",
  "safetensors>=0.4.0,<1",
  "matplotlib>=3.7,<4",
  "ViennaRNA>=2.6,<3",   # RNA structure layout geometry only; never used to fold
  "plotly>=5.0,<7",
  "datasets>=2.16,<5",
  "accelerate>=0.26,<2",
  "peft>=0.10.0,<1",
]

[project.urls]
Homepage = "https://github.com/garykbrixi/minerva"
Source = "https://github.com/garykbrixi/minerva"

[project.optional-dependencies]
flash = [
  "flash-attn>=2.5.8",
]
viz = [
  "bokeh>=3,<4",   # interactive contact viewer (minerva.visualization.bokeh_contact_viewer)
]
dev = [
  "pytest>=7,<10",
  # executing examples/notebooks (tests/test_notebooks.py)
  "nbclient>=0.8,<1",
  "ipykernel>=6,<8",
  "ipywidgets>=8,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["minerva*"]

[tool.setuptools.package-data]
"minerva" = ["py.typed", "vendor_rinalmo/LICENSE", "example_data/*.gb"]
